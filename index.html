<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <title>Stickers Catalogue</title>
</head>

<body class="dark-theme">
    <div style="text-align: center;">
        <h1>Stickers Catalogue</h1>
        <p>Buscar por tags. Luego hacer click en un tag para eliminarlo</p>
    </div>

    <div id="configuration" class="row">
        <!-- Cambiar checkbox por un toggle  -->
        <div class="toggle-container">
            <label class="switch">
                <input type="checkbox" id="toggle" checked>
                <span class="slider"></span>
            </label>
            <span class="mode-label" id="modeLabel">Dark Mode</span>
        </div>

        <div class="search-container">
            <div class="search-bar">
                <div class="autocomplete" style="width:200px;">
                    <input type="text" id="search" placeholder="Buscar tags" autocomplete="off">
                </div>
                <button id="addTagButton" type="submit">Agregar Tag</button>
                <!-- Input de texto para buscar por tags -->
                <div id="tagsList" class="taglist"></div>
            </div>

        </div>

    </div>
    <div id="catalogue">
    </div>
    <script src="main.js"></script>
</body>

</html>
